<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODEX Gallery — Export</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#03071a;--bg2:#060d20;--bdr:rgba(255,255,255,.06);--txt:#f1f5f9;--txt2:#94a3b8;--mut:#475569;--mut2:#64748b;--blue:#3b82f6;--purple:#a855f7;--green:#4ade80;--amber:#fbbf24;--fi:Inter,system-ui,sans-serif;--fd:'Syne',Inter,sans-serif;--fc:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--txt);font-family:var(--fi);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
.ro-nav{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:rgba(3,7,26,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr)}
.ro-nav::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.4),rgba(168,85,247,.4),transparent)}
.ro-logo{font-family:var(--fd);font-size:1.25rem;font-weight:800;letter-spacing:.15em;background:linear-gradient(135deg,#fff,#93c5fd,#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ro-badge{font-size:.6rem;padding:.16rem .55rem;border-radius:99px;border:1px solid rgba(168,85,247,.35);color:#c4b5fd;background:rgba(168,85,247,.08)}
.ro-btn{display:inline-flex;align-items:center;gap:.28rem;padding:.28rem .7rem;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--txt2);font-family:var(--fi);font-size:.71rem;cursor:pointer;transition:all .18s}
.ro-btn:hover{border-color:rgba(59,130,246,.4);color:var(--txt);background:rgba(59,130,246,.07)}
.ro-btn-g{border-color:rgba(74,222,128,.28);color:var(--green);background:rgba(74,222,128,.05)}
.ro-btn-g:hover{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.5)}
.ro-main{padding:2rem 2rem 4rem}
.ro-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.ro-title{font-family:var(--fd);font-size:1.4rem;font-weight:700}
.ro-hr{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}
.ro-cnt{font-size:.62rem;color:var(--mut)}
.ro-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.ro-card{border-radius:16px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:4/3;background:#000;border:1px solid rgba(255,255,255,.06);transition:transform .3s cubic-bezier(.34,1.2,.64,1),border-color .3s,box-shadow .3s;animation:cIn .4s both;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.ro-card:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(255,255,255,.18);box-shadow:0 32px 60px -8px rgba(0,0,0,.8)}
@keyframes cIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}
.ro-cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.ro-live{position:absolute;inset:0;overflow:hidden;background:#000}
.ro-live iframe{position:absolute;inset:0;width:100%;height:100%;border:none;pointer-events:none;opacity:0;transition:opacity .6s}
.ro-spin-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ro-spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.07);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ro-glow{position:absolute;top:0;left:0;right:0;height:3px;z-index:4}
.ro-lbl{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:.6rem .9rem .5rem;background:linear-gradient(to top,rgba(0,0,0,.92),transparent)}
.ro-lname{font-family:var(--fd);font-size:.92rem;font-weight:700;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.ro-lmeta{font-family:var(--fc);font-size:.56rem;color:rgba(255,255,255,.48);margin-top:.07rem}
.ro-tag{font-size:.56rem;color:rgba(255,255,255,.6);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:.04rem .28rem;border-radius:99px;font-family:var(--fc)}
.ro-ov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);display:none}
.ro-det{position:absolute;inset:0;display:flex;flex-direction:column;max-width:1200px;width:100%;margin:0 auto;background:var(--bg2);border-left:1px solid var(--bdr);border-right:1px solid var(--bdr)}
.ro-dh{display:flex;align-items:flex-start;justify-content:space-between;padding:1rem 1.6rem .8rem;border-bottom:1px solid var(--bdr);background:rgba(3,7,26,.7);flex-shrink:0;position:relative;gap:1rem;overflow:hidden}
.ro-dh::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(59,130,246,.4),rgba(168,85,247,.4),transparent)}
.ro-dname{font-family:var(--fd);font-size:1.65rem;font-weight:700;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.2rem}
.ro-ddesc{font-size:.74rem;color:var(--txt2);line-height:1.55;max-width:520px}
.ro-tabs{display:flex;border-bottom:1px solid var(--bdr);padding:0 1.6rem;background:rgba(3,7,26,.5);flex-shrink:0;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.ro-tabs::-webkit-scrollbar{display:none}
.ro-tab{padding:.5rem .75rem .44rem;font-size:.7rem;color:var(--mut2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .18s;white-space:nowrap}
.ro-tab:hover{color:var(--txt2)}
.ro-tab.on{color:var(--txt);border-bottom-color:var(--blue)}
.ro-body{flex:1;overflow:hidden;display:flex}
.ro-panel{display:none;flex:1;overflow:auto;flex-direction:column}
.ro-panel.on{display:flex}
.ro-pvc{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
.ro-pvc iframe{width:100%;height:100%;border:none}
.ro-pvc canvas{max-width:90%;max-height:86%;border:1px solid rgba(255,255,255,.07);border-radius:10px}
.ro-fsb{position:absolute;top:10px;right:10px;z-index:10;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:.22rem .46rem;font-size:.6rem;color:var(--mut2);cursor:pointer;backdrop-filter:blur(8px)}
.ro-fsb:hover{color:var(--txt);border-color:rgba(59,130,246,.4)}
.ro-cbar{display:flex;align-items:center;gap:.5rem;padding:.4rem .85rem;border-bottom:1px solid var(--bdr);background:rgba(3,7,26,.8);flex-shrink:0}
.ro-fn{font-family:var(--fc);font-size:.63rem;color:var(--mut2);flex:1}
.ro-cw{flex:1;overflow:auto;padding:1.2rem 1.2rem 3rem;font-family:var(--fc);font-size:.75rem;line-height:1.8;color:#cdd6f4}
.ro-cl{display:flex;transition:background .1s}
.ro-cl:hover{background:rgba(59,130,246,.05)}
.ro-ln{color:rgba(71,85,105,.45);user-select:none;min-width:2.1rem;padding-right:.65rem;text-align:right;font-size:.61rem;flex-shrink:0}
.ro-lc{flex:1;white-space:pre-wrap;word-break:break-all}
.ro-sb{width:188px;flex-shrink:0;border-right:1px solid var(--bdr);overflow-y:auto;padding:.9rem;background:rgba(0,0,0,.2)}
.ro-sbl{font-size:.53rem;text-transform:uppercase;letter-spacing:.16em;color:var(--mut);margin-bottom:.35rem;margin-top:.88rem;font-weight:500}
.ro-sbl:first-child{margin-top:0}
.ro-sbi{display:flex;justify-content:space-between;font-size:.66rem;color:var(--txt2);margin-bottom:.14rem}
.ro-sbi span:last-child{color:var(--txt);font-family:var(--fc);font-size:.6rem}
.ro-cxb{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:.18rem 0 .5rem}
.ro-cxf{height:100%;border-radius:2px}
.ro-fsov{position:fixed;inset:0;z-index:600;background:#000;display:none;flex-direction:column}
.ro-fsov.on{display:flex}
.ro-fsh{display:flex;align-items:center;justify-content:space-between;padding:.48rem 1rem;border-bottom:1px solid var(--bdr);background:rgba(3,7,26,.95);flex-shrink:0}
.ro-fsbdy{flex:1;overflow:hidden}
.ro-fsbdy iframe,.ro-fsbdy canvas{width:100%;height:100%;border:none;display:block}
.ro-toast{position:fixed;bottom:1.2rem;right:1.2rem;z-index:999;padding:.42rem .88rem;border-radius:8px;font-size:.7rem;border:1px solid rgba(74,222,128,.2);color:var(--green);background:rgba(0,14,9,.95);backdrop-filter:blur(16px);opacity:0;transform:translateX(10px);transition:all .25s;pointer-events:none}
.ro-toast.show{opacity:1;transform:none}
.s-kw{color:#c792ea}.s-str{color:#c3e88d}.s-cmt{color:#4a5568;font-style:italic}.s-num{color:#f78c6c}.s-fn{color:#82aaff}.s-cls{color:#ffcb6b}
@media(max-width:680px){.ro-nav,.ro-main{padding-left:1rem;padding-right:1rem}.ro-grid{grid-template-columns:1fr}.ro-sb{display:none}}
</style>
</head>

    if(isFn){ctx.shadowColor=ac;ctx.shadowBlur=PX*1.5}ctx.fillStyle=col+Math.round(alpha*255).toString(16).padStart(2,'0');ctx.fillRect(sc*PX,rowY*PX,(ec-sc)*PX-1,PX-1);ctx.shadowBlur=0;
  });
  for(let y=0;y<H;y+=2){ctx.fillStyle='rgba(0,0,0,.07)';ctx.fillRect(0,y,W,1)}
  const tg=ctx.createLinearGradient(0,0,W,0);tg.addColorStop(0,'transparent');tg.addColorStop(.5,ac);tg.addColorStop(1,'transparent');ctx.shadowColor=ac;ctx.shadowBlur=6;ctx.fillStyle=tg;ctx.fillRect(0,0,W,2.5);ctx.shadowBlur=0;
  const grd=ctx.createLinearGradient(0,H*.4,0,H);grd.addColorStop(0,'transparent');grd.addColorStop(1,'rgba('+r2+','+g2+','+b2+',.2)');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  const vig=ctx.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.85);vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  const cxs=cx(p.code),cc=cxC(cxs);ctx.fillStyle=cc.c+'50';ctx.fillRect(PX,H-PX*2,W*.3,PX-1);ctx.fillStyle=cc.c+'AA';ctx.fillRect(PX,H-PX*2,(cxs/100)*W*.3,PX-1);
}
function isLivable(p){if(p.language==='HTML'||p.language==='CSS')return true;if(p.language==='JavaScript'&&(p.code.includes('canvas')||p.code.includes('requestAnimationFrame')||p.code.includes('setInterval')))return true;return false}
function buildSrcdoc(p){
  const safe=p.code.replace(/<\/script>/gi,'<\\/script>');
  if(p.language==='HTML'||/<!DOCTYPE|<html\b/i.test(p.code.slice(0,300))){if(/<!DOCTYPE|<html\b/i.test(p.code.slice(0,300)))return p.code;return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui}</style></head><body>'+p.code+'</body></html>';}
  if(p.language==='CSS'){const sels=[...new Set((p.code.match(/\.([a-zA-Z][\w-]*)/g)||[]).map(c=>c.slice(1)))];const body=sels.length>0?sels.slice(0,3).map(c=>'<div class="'+c+'"></div>').join(''):'<div></div>';const safeCss=p.code.replace(/<\/style>/gi,'<\\/style>');return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1.5rem;padding:1.5rem}'+safeCss+'</style></head><body>'+body+'</body></html>';}
  if(p.code.includes('canvas')||p.code.includes('requestAnimationFrame'))return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%!important;height:100%!important}</style></head><body><canvas></canvas><script>'+safe+'<\/script></body></html>';
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{box-sizing:border-box;margin:0}body{background:#020817;color:#cdd6f4;font-family:monospace;font-size:11px;padding:.75rem;overflow:hidden}#out{line-height:1.6}.ok{color:#4ade80}.err{color:#f87171}</style></head><body><div id="out"></div><script>var out=document.getElementById("out");function add(c,t){var d=document.createElement("div");d.className=c;d.textContent=t;out.appendChild(d)}var ol=console.log;console.log=function(){ol.apply(console,arguments);add("ok",Array.from(arguments).map(function(x){return typeof x==="object"?JSON.stringify(x):String(x)}).join(" "))};try{(function(){'+safe+'})()}catch(e){add("err",e.message)}<\/script></body></html>';
}
const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(!e.isIntersecting)return;const el=e.target,pid=el.closest('[data-id]')?.dataset.id,p=P.find(x=>x.id===pid);if(!p)return;if(el.classList.contains('ro-live')){if(el.dataset.loaded)return;el.dataset.loaded='1';const ph=el.querySelector('.ro-spin-wrap');const ifr=document.createElement('iframe');ifr.sandbox='allow-scripts';ifr.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:none;pointer-events:none;opacity:0;transition:opacity .6s';ifr.onload=()=>{ifr.style.opacity='1';if(ph)ph.style.display='none'};ifr.srcdoc=buildSrcdoc(p);el.appendChild(ifr)}else if(el.classList.contains('ro-cv')){if(el.dataset.drawn)return;el.dataset.drawn='1';drawThumb(el,p)}obs.unobserve(el)})},{rootMargin:'100px',threshold:0.01});
document.querySelectorAll('.ro-cv,.ro-live').forEach(el=>obs.observe(el));
function openDetail(id){const p=P.find(x=>x.id===id);if(!p)return;curP=p;const lc=LC[p.language]||'#888',cxs=cx(p.code),cc=cxC(cxs),s=cst(p.code),coll=C.find(c=>c.id===p.collId);document.getElementById('roDname').textContent=p.name;document.getElementById('roDdesc').textContent=p.description||'';
document.getElementById('roMeta').innerHTML='<span style="width:22px;height:3px;border-radius:2px;background:'+p.accentColor+';display:inline-block"></span><span style="font-family:var(--fc);font-size:.59rem;padding:.07rem .36rem;border-radius:99px;border:1px solid;color:'+lc+';border-color:'+lc+'28;background:'+lc+'0D">'+p.language+'</span><span style="font-family:var(--fc);font-size:.59rem;padding:.07rem .3rem;border-radius:4px;border:1px solid rgba(255,255,255,.08);color:'+cc.c+'">CX '+cxs+' · '+cc.l+'</span>'+(p.starred?'<span style="color:#fbbf24">★</span>':'')+'';document.getElementById('roFn').textContent=EXT[p.language]||'code.txt';
let sb='<div class="ro-sbl">Language</div><div class="ro-sbi"><span>'+p.language+'</span></div>';
if(coll)sb+='<div class="ro-sbl">Collection</div><div class="ro-sbi"><span style="display:flex;align-items:center;gap:.3rem"><span style="width:7px;height:7px;border-radius:50%;background:'+coll.color+'"></span>'+esc(coll.name)+'</span></div>';
sb+='<div class="ro-sbl">Complexity</div><div style="display:flex;justify-content:space-between;font-size:.63rem;color:var(--txt2);margin-bottom:.14rem"><span style="color:'+cc.c+'">'+cc.l+'</span><span style="font-family:var(--fc);font-size:.58rem;color:'+cc.c+'">'+cxs+'/100</span></div><div class="ro-cxb"><div class="ro-cxf" style="width:'+cxs+'%;background:'+cc.c+'"></div></div>';
sb+='<div class="ro-sbl">Statistics</div><div class="ro-sbi"><span>Lines</span><span>'+s.tot+'</span></div><div class="ro-sbi"><span>Code</span><span>'+s.ne+'</span></div><div class="ro-sbi"><span>Comments</span><span>'+s.cm+'</span></div>';
if(p.tags&&p.tags.length)sb+='<div class="ro-sbl">Tags</div><div style="display:flex;flex-wrap:wrap;gap:.18rem">'+p.tags.map(t=>'<span class="ro-tag">'+esc(t)+'</span>').join('')+'</div>';
document.getElementById('roSb').innerHTML=sb;
document.getElementById('roCode').innerHTML=hlCode(p.code,p.language).split('\n').map((l,i)=>'<div class="ro-cl"><span class="ro-ln">'+( i+1)+'</span><span class="ro-lc">'+( l||'&nbsp;')+'</span></div>').join('');
setROTab('prev');document.getElementById('roOv').style.display='block';document.body.style.overflow='hidden';}
function closeDetail(){document.getElementById('roOv').style.display='none';document.body.style.overflow='';curP=null}
function setROTab(t){roTab=t;['prev','code'].forEach(k=>{document.getElementById('rt-'+k).classList.toggle('on',k===t);document.getElementById('rp-'+k).classList.toggle('on',k===t)});if(t==='prev'&&curP)buildROPrev(curP)}
function buildROPrev(p){const el=document.getElementById('roPvc');const fb=el.querySelector('.ro-fsb');const fbc=fb?.cloneNode(true);el.innerHTML='';if(fbc){fbc.onclick=openROFs;el.appendChild(fbc);}if(!p)return;if(isLivable(p)){const ifr=document.createElement('iframe');ifr.style.cssText='width:100%;height:100%;border:none';ifr.sandbox='allow-scripts';ifr.srcdoc=buildSrcdoc(p);el.appendChild(ifr)}else{const cv=document.createElement('canvas');const W=Math.min(520,el.clientWidth-40||480),H=Math.round(W*.72);cv.width=W;cv.height=H;cv.style.cssText='max-width:90%;max-height:86%;border:1px solid rgba(255,255,255,.07);border-radius:10px';el.appendChild(cv);drawThumb(cv,p)}}
function openROFs(){if(!curP)return;const b=document.getElementById('roFsB');b.innerHTML='';document.getElementById('roFsT').textContent=curP.name;if(isLivable(curP)){const ifr=document.createElement('iframe');ifr.style.cssText='width:100%;height:100%;border:none';ifr.srcdoc=buildSrcdoc(curP);ifr.sandbox='allow-scripts';b.appendChild(ifr)}else{const cv=document.createElement('canvas');cv.style.cssText='width:100%;height:100%;display:block';cv.width=b.clientWidth||1200;cv.height=b.clientHeight||720;b.appendChild(cv);drawThumb(cv,curP)}document.getElementById('roFsOv').classList.add('on')}
function closeROFs(){document.getElementById('roFsOv').classList.remove('on')}
async function copyROCode(){if(!curP)return;try{await navigator.clipboard.writeText(curP.code);toast2('Code copied ✓')}catch{toast2('Copy failed')}}
function dlROCode(){if(!curP)return;const blob=new Blob([curP.code],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=EXT[curP.language]||'code.txt';a.click()}
function importBack(){try{const json=JSON.stringify({P,C},null,2);navigator.clipboard.writeText(json).then(()=>{toast2('JSON copied — paste in CODEX → ⬇ JSON → Import ✓')}).catch(()=>{const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='codex-import.json';a.click();toast2('JSON downloaded — import via CODEX')});}catch(e){toast2('Error: '+e.message)}}
function toast2(msg){const t=document.getElementById('roToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeROFs()}});
